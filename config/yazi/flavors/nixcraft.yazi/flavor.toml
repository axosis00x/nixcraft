# Yazi flavor — Gruvbox
# Installed as ~/.config/yazi/flavors/nixcraft.yazi/flavor.toml by apply-theme.sh.
# Overrides only the style colors; icon/filetype tables stay in theme.toml.

[app]
overall = {}

[mgr]
cwd = { fg = "#83a598" }

find_keyword  = { fg = "#fabd2f", bold = true, italic = true, underline = true }
find_position = { fg = "#d3869b", bg = "reset", bold = true, italic = true }

symlink_target = { italic = true }

marker_copied   = { fg = "#b8bb26", bg = "#b8bb26" }
marker_cut      = { fg = "#fb4934", bg = "#fb4934" }
marker_marked   = { fg = "#83a598", bg = "#83a598" }
marker_selected = { fg = "#fabd2f", bg = "#fabd2f" }
marker_symbol   = "│"

count_copied   = { fg = "#1d2021", bg = "#b8bb26" }
count_cut      = { fg = "#1d2021", bg = "#fb4934" }
count_selected = { fg = "#1d2021", bg = "#fabd2f" }

border_symbol = "│"
border_style  = { fg = "#504945" }

syntect_theme = ""

[tabs]
active   = { bg = "#fe8019", bold = true }
inactive = { fg = "#fe8019", bg = "#504945" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { bg = "#fe8019", bold = true }
normal_alt  = { fg = "#fe8019", bg = "#504945" }

select_main = { bg = "#fb4934", bold = true }
select_alt  = { fg = "#fb4934", bg = "#504945" }

unset_main = { bg = "#fb4934", bold = true }
unset_alt  = { fg = "#fb4934", bg = "#504945" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#504945" }
perm_type  = { fg = "#b8bb26" }
perm_read  = { fg = "#fabd2f" }
perm_write = { fg = "#fb4934" }
perm_exec  = { fg = "#83a598" }

progress_label  = { bold = true }
progress_normal = { fg = "#b8bb26", bg = "#1d2021" }
progress_error  = { fg = "#fabd2f", bg = "#fb4934" }

[which]
cols            = 3
mask            = { bg = "#1d2021" }
cand            = { fg = "#83a598" }
rest            = { fg = "#504945" }
desc            = { fg = "#d3869b" }
separator       = "  "
separator_style = { fg = "#504945" }

[confirm]
border     = { fg = "#fe8019" }
title      = { fg = "#fe8019" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#fe8019" }
title  = { fg = "#fe8019" }

tbl_col  = { fg = "#fe8019" }
tbl_cell = { fg = "#fabd2f", reversed = true }

[notify]
title_info  = { fg = "#b8bb26" }
title_warn  = { fg = "#fabd2f" }
title_error = { fg = "#fb4934" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border   = { fg = "#fe8019" }
active   = { fg = "#d3869b", bold = true }
inactive = {}

[input]
border   = { fg = "#fe8019" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "#fe8019" }
active   = { reversed = true }
inactive = {}

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#fe8019" }
title   = {}
hovered = { fg = "#d3869b", bold = true }

[help]
on      = { fg = "#83a598" }
run     = { fg = "#d3869b" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#1d2021", bg = "#ebdbb2" }
