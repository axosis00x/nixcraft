name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every host's system must evaluate; building it would take far too long.
  eval:
    name: Evaluate hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate every nixosConfiguration
        run: |
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::$host"
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Tools come from the flake's own nixpkgs, so CI matches the system.
      - name: Nix formatting
        # hardware-configuration.nix is generated by nixos-generate-config.
        run: |
          git ls-files '*.nix' ':!:hosts/*/hardware-configuration.nix' |
            xargs nix shell --inputs-from . nixpkgs#nixfmt --command nixfmt --check
      - name: Shell scripts
        run: git ls-files '*.sh' | xargs nix shell --inputs-from . nixpkgs#shellcheck --command shellcheck -S warning
      - name: Lua syntax
        run: |
          git ls-files -z '*.lua' |
            nix shell --inputs-from . nixpkgs#lua5_4 --command xargs -0 -n1 luac -p

  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VERSION is X.Y.Z[-PHASE.N] and has a changelog entry
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(pre-alpha|alpha|beta|rc)\.[1-9][0-9]*)?$ ]] ||
            { echo "::error file=VERSION::not X.Y.Z or X.Y.Z-PHASE.N: $version"; exit 1; }
          if [[ $version != 0.0.0 ]]; then
            scripts/release.sh notes > /dev/null || { echo "::error file=CHANGELOG.md::no entry for $version"; exit 1; }
          fi

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check new commit subjects
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before"; check just the pushed commit then.
          if [[ -z $BASE || $BASE =~ ^0+$ ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            range=("$HEAD" -1)
          else
            range=("$BASE..$HEAD")
          fi
          pattern='^((feat|fix|perf|refactor|style|docs|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+|Merge .+|Revert ".+")$'
          bad=0
          while IFS= read -r line; do
            subject=${line#* }
            if ! grep -qP "$pattern" <<< "$subject"; then
              echo "::error::${line%% *} is not a Conventional Commit: $subject"
              bad=1
            fi
          done < <(git log --format='%h %s' "${range[@]}")
          exit $bad
