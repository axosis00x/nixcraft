# Yazi flavor — Mocha
# Installed as ~/.config/yazi/flavors/nixcraft.yazi/flavor.toml by apply-theme.sh.
# Overrides only the style colors; icon/filetype tables stay in theme.toml.

[app]
overall = {}

[mgr]
cwd = { fg = "#89dceb" }

find_keyword  = { fg = "#f9e2af", bold = true, italic = true, underline = true }
find_position = { fg = "#f5c2e7", bg = "reset", bold = true, italic = true }

symlink_target = { italic = true }

marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#89dceb", bg = "#89dceb" }
marker_selected = { fg = "#f9e2af", bg = "#f9e2af" }
marker_symbol   = "│"

count_copied   = { fg = "#11111b", bg = "#a6e3a1" }
count_cut      = { fg = "#11111b", bg = "#f38ba8" }
count_selected = { fg = "#11111b", bg = "#f9e2af" }

border_symbol = "│"
border_style  = { fg = "#45475a" }

syntect_theme = ""

[tabs]
active   = { bg = "#cba6f7", bold = true }
inactive = { fg = "#cba6f7", bg = "#45475a" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { bg = "#cba6f7", bold = true }
normal_alt  = { fg = "#cba6f7", bg = "#45475a" }

select_main = { bg = "#f38ba8", bold = true }
select_alt  = { fg = "#f38ba8", bg = "#45475a" }

unset_main = { bg = "#f38ba8", bold = true }
unset_alt  = { fg = "#f38ba8", bg = "#45475a" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#45475a" }
perm_type  = { fg = "#a6e3a1" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#89dceb" }

progress_label  = { bold = true }
progress_normal = { fg = "#a6e3a1", bg = "#11111b" }
progress_error  = { fg = "#f9e2af", bg = "#f38ba8" }

[which]
cols            = 3
mask            = { bg = "#11111b" }
cand            = { fg = "#89dceb" }
rest            = { fg = "#45475a" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#45475a" }

[confirm]
border     = { fg = "#cba6f7" }
title      = { fg = "#cba6f7" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#cba6f7" }
title  = { fg = "#cba6f7" }

tbl_col  = { fg = "#cba6f7" }
tbl_cell = { fg = "#f9e2af", reversed = true }

[notify]
title_info  = { fg = "#a6e3a1" }
title_warn  = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border   = { fg = "#cba6f7" }
active   = { fg = "#f5c2e7", bold = true }
inactive = {}

[input]
border   = { fg = "#cba6f7" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "#cba6f7" }
active   = { reversed = true }
inactive = {}

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#cba6f7" }
title   = {}
hovered = { fg = "#f5c2e7", bold = true }

[help]
on      = { fg = "#89dceb" }
run     = { fg = "#f5c2e7" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#11111b", bg = "#cdd6f4" }
