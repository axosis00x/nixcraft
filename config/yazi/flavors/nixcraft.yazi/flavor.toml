# Yazi flavor — Tokyo Night
# Installed as ~/.config/yazi/flavors/nixcraft.yazi/flavor.toml by apply-theme.sh.
# Overrides only the style colors; icon/filetype tables stay in theme.toml.

[app]
overall = {}

[mgr]
cwd = { fg = "#7dcfff" }

find_keyword  = { fg = "#e0af68", bold = true, italic = true, underline = true }
find_position = { fg = "#bb9af7", bg = "reset", bold = true, italic = true }

symlink_target = { italic = true }

marker_copied   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#7dcfff", bg = "#7dcfff" }
marker_selected = { fg = "#e0af68", bg = "#e0af68" }
marker_symbol   = "│"

count_copied   = { fg = "#13141c", bg = "#9ece6a" }
count_cut      = { fg = "#13141c", bg = "#f7768e" }
count_selected = { fg = "#13141c", bg = "#e0af68" }

border_symbol = "│"
border_style  = { fg = "#373d58" }

syntect_theme = ""

[tabs]
active   = { bg = "#7aa2f7", bold = true }
inactive = { fg = "#7aa2f7", bg = "#373d58" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { bg = "#7aa2f7", bold = true }
normal_alt  = { fg = "#7aa2f7", bg = "#373d58" }

select_main = { bg = "#f7768e", bold = true }
select_alt  = { fg = "#f7768e", bg = "#373d58" }

unset_main = { bg = "#f7768e", bold = true }
unset_alt  = { fg = "#f7768e", bg = "#373d58" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#373d58" }
perm_type  = { fg = "#9ece6a" }
perm_read  = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec  = { fg = "#7dcfff" }

progress_label  = { bold = true }
progress_normal = { fg = "#9ece6a", bg = "#13141c" }
progress_error  = { fg = "#e0af68", bg = "#f7768e" }

[which]
cols            = 3
mask            = { bg = "#13141c" }
cand            = { fg = "#7dcfff" }
rest            = { fg = "#373d58" }
desc            = { fg = "#bb9af7" }
separator       = "  "
separator_style = { fg = "#373d58" }

[confirm]
border     = { fg = "#7aa2f7" }
title      = { fg = "#7aa2f7" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#7aa2f7" }
title  = { fg = "#7aa2f7" }

tbl_col  = { fg = "#7aa2f7" }
tbl_cell = { fg = "#e0af68", reversed = true }

[notify]
title_info  = { fg = "#9ece6a" }
title_warn  = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border   = { fg = "#7aa2f7" }
active   = { fg = "#bb9af7", bold = true }
inactive = {}

[input]
border   = { fg = "#7aa2f7" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "#7aa2f7" }
active   = { reversed = true }
inactive = {}

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#7aa2f7" }
title   = {}
hovered = { fg = "#bb9af7", bold = true }

[help]
on      = { fg = "#7dcfff" }
run     = { fg = "#bb9af7" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#13141c", bg = "#c0caf5" }
