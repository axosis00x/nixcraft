name: Release

# ./release.sh pushes a vX.Y.Z or vX.Y.Z-PHASE.N tag; this publishes it as a GitHub release
# whose notes are that version's CHANGELOG.md entry.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Tag matches VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::tag $GITHUB_REF_NAME but VERSION is $version"; exit 1; }
      - name: Evaluate every nixosConfiguration
        run: |
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./release.sh notes > notes.md
          # vX.Y.Z-PHASE.N (pre-alpha, alpha, beta, rc) is marked as a pre-release.
          prerelease=()
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "nixcraft $GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${prerelease[@]}"
