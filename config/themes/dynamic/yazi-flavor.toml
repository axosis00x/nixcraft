# Yazi flavor — dynamic (generated by matugen)
# Installed as ~/.config/yazi/flavors/nixcraft.yazi/flavor.toml by apply-theme.sh.
# Overrides only the style colors; icon/filetype tables stay in theme.toml.

[app]
overall = {}

[mgr]
cwd = { fg = "#7ad0ff" }

find_keyword  = { fg = "#b4c6f9", bold = true, italic = true, underline = true }
find_position = { fg = "#b1c9e8", bg = "reset", bold = true, italic = true }

symlink_target = { italic = true }

marker_copied   = { fg = "#b1c9e8", bg = "#b1c9e8" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#7ad0ff", bg = "#7ad0ff" }
marker_selected = { fg = "#b4c6f9", bg = "#b4c6f9" }
marker_symbol   = "│"

count_copied   = { fg = "#0b151a", bg = "#b1c9e8" }
count_cut      = { fg = "#0b151a", bg = "#ffb4ab" }
count_selected = { fg = "#0b151a", bg = "#b4c6f9" }

border_symbol = "│"
border_style  = { fg = "#3e484f" }

syntect_theme = ""

[tabs]
active   = { bg = "#7ad0ff", bold = true }
inactive = { fg = "#7ad0ff", bg = "#3e484f" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { bg = "#7ad0ff", bold = true }
normal_alt  = { fg = "#7ad0ff", bg = "#3e484f" }

select_main = { bg = "#ffb4ab", bold = true }
select_alt  = { fg = "#ffb4ab", bg = "#3e484f" }

unset_main = { bg = "#ffb4ab", bold = true }
unset_alt  = { fg = "#ffb4ab", bg = "#3e484f" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#3e484f" }
perm_type  = { fg = "#b1c9e8" }
perm_read  = { fg = "#b4c6f9" }
perm_write = { fg = "#ffb4ab" }
perm_exec  = { fg = "#7ad0ff" }

progress_label  = { bold = true }
progress_normal = { fg = "#b1c9e8", bg = "#172127" }
progress_error  = { fg = "#b4c6f9", bg = "#ffb4ab" }

[which]
cols            = 3
mask            = { bg = "#172127" }
cand            = { fg = "#7ad0ff" }
rest            = { fg = "#3e484f" }
desc            = { fg = "#b4c6f9" }
separator       = "  "
separator_style = { fg = "#3e484f" }

[confirm]
border     = { fg = "#7ad0ff" }
title      = { fg = "#7ad0ff" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#7ad0ff" }
title  = { fg = "#7ad0ff" }

tbl_col  = { fg = "#7ad0ff" }
tbl_cell = { fg = "#b4c6f9", reversed = true }

[notify]
title_info  = { fg = "#b1c9e8" }
title_warn  = { fg = "#b4c6f9" }
title_error = { fg = "#ffb4ab" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border   = { fg = "#7ad0ff" }
active   = { fg = "#b4c6f9", bold = true }
inactive = {}

[input]
border   = { fg = "#7ad0ff" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "#7ad0ff" }
active   = { reversed = true }
inactive = {}

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#7ad0ff" }
title   = {}
hovered = { fg = "#b4c6f9", bold = true }

[help]
on      = { fg = "#7ad0ff" }
run     = { fg = "#b4c6f9" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#172127", bg = "#dae4ec" }
